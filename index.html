<style>
/* Layout: one column — header with language flags, the "fridge" (what you have), matching recipes, recipe sites last. */
:root{
  --bg:#eef2f4; --surface:#ffffff; --surface-2:#e3e9ec; --line:#cdd6db;

  --have:#2f7d5b; --have-bg:#dcefe5; --miss:#a8452e; --miss-bg:#f6e1da;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#10181d; --surface:#18232a; --surface-2:#1f2c34; --line:#2c3b44;
  --fg:#e6edf0; --muted:#93a4ad; --accent:#f2b63a; --accent-ink:#241800;
  --have:#7fd1a8; --have-bg:#173a2b; --miss:#f0a08b; --miss-bg:#3d2019; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 var(--f-body);
  padding-inline:16px;padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(48px + env(safe-area-inset-bottom,0px))}
a{color:inherit}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(2rem,6vw,3rem);font-weight:800;letter-spacing:-.02em}
h1 span{color:var(--accent)}
.lede{color:var(--muted);margin:6px 0 0;max-width:60ch}
.label{font:500 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.topbar{display:flex;justify-content:flex-end}
.langs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.langs button{display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;background:transparent;color:var(--muted);border-radius:999px;padding:5px 11px 5px 7px;font:500 .78rem var(--f-mono);letter-spacing:.06em;cursor:pointer}
.langs button:hover{color:var(--fg)}
.langs button[aria-pressed="true"]{background:var(--surface-2);border-color:var(--line);color:var(--fg)}
.langs svg{width:24px;height:16px;border-radius:3px;display:block;box-shadow:0 0 0 1px rgba(0,0,0,.18)}

.fridge{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px}
.row-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--muted);font:inherit;font-size:.85rem;text-decoration:underline;cursor:pointer;padding:0}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
input:focus-visible,button:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:8px;padding:9px 14px;font-weight:700}
.btn:hover{border-color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:38px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--have-bg);color:var(--have);border-radius:999px;padding:5px 6px 5px 12px;font-weight:700;font-size:.92rem}
.chip.unknown{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.chip button{border:0;background:transparent;color:inherit;width:24px;height:24px;border-radius:50%;line-height:1;font-size:1.05rem}
.chip button:hover{background:color-mix(in srgb,currentColor 15%,transparent)}
.hint{color:var(--muted);font-size:.85rem;margin:-6px 0 0}
.empty{color:var(--muted);font-size:.92rem}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.quick button{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:4px 10px;font-size:.85rem}
.quick button:hover{color:var(--fg);border-color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.opts label{display:flex;flex-direction:column;gap:4px}
select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.toggles{display:flex;flex-direction:column;gap:6px}
.toggle{display:flex;align-items:flex-start;gap:8px;font-size:.92rem;color:var(--muted)}
.toggle input{margin-top:4px;accent-color:var(--accent)}

.results{display:flex;flex-direction:column;gap:14px}
.results-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.results-head h2{font-size:1.5rem}
.count{font:500 .78rem var(--f-mono);color:var(--muted)}
.list{display:flex;flex-direction:column;gap:12px}
.recipe{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.recipe summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:16px 18px}
.recipe summary::-webkit-details-marker{display:none}
.recipe h3{font-size:1.15rem;font-weight:700}
.meta{font:500 .76rem var(--f-mono);color:var(--muted);letter-spacing:.03em;display:flex;gap:6px 14px;flex-wrap:wrap}
.desc{margin:0;color:var(--muted);font-size:.95rem}
.score{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.82rem;font-weight:700;margin-top:2px}
.pill{padding:2px 9px;border-radius:999px}
.pill.have{background:var(--have-bg);color:var(--have)}
.pill.miss{background:var(--miss-bg);color:var(--miss)}
.more{font-size:.82rem;color:var(--muted);font-weight:700}
.recipe[open] .more{display:none}
.body{border-top:1px solid var(--line);padding:16px 18px 20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:24px}
@media (max-width:620px){.body{grid-template-columns:1fr}}
.ings{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
.ings li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:6px;font-size:.95rem}
.ings .mk{font-weight:700}
.ings li.h .mk{color:var(--have)}
.ings li.m .mk{color:var(--miss)}
.ings li.s .mk{color:var(--muted)}
.amt{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.legend{margin-top:10px}
.steps{margin:8px 0 0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px}
.links{grid-column:1/-1;font-size:.9rem;font-weight:700;display:flex;flex-direction:column;gap:6px}
.untr{font-weight:400;color:var(--muted);font-size:.85rem}
.note{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:18px;color:var(--muted)}
.showmore{align-self:flex-start}

.sites{background:var(--surface-2);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.sites h2{font-size:1.15rem}
.sites p{margin:0;color:var(--muted);font-size:.92rem}
.site-links{display:flex;flex-wrap:wrap;gap:8px}
.site-links a{text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:700;font-size:.92rem}
.site-links a:hover{border-color:var(--muted)}
footer{color:var(--muted);font-size:.82rem;border-top:1px solid var(--line);padding-top:14px}
</style>
</head>

</div>

  let s=" "+a+" ";
  const W={en:{"łyżka":"tbsp","łyżki":"tbsp","łyżek":"tbsp","łyżeczka":"tsp","łyżeczki":"tsp","łyżeczek":"tsp","ząbek":"clove","ząbki":"cloves","ząbków":"cloves","puszka":"can","puszki":"cans","puszek":"cans","pęczek":"bunch","kromki":"slices","kromek":"slices","plastry":"slices","plastrów":"slices","liście":"leaves","ziarna":"berries","ziaren":"berries","żółtko":"egg yolk","żółtka":"egg yolks","opcjonalnie":"optional","szt.":"","ok.":"about"},
           da:{"łyżka":"spsk.","łyżki":"spsk.","łyżek":"spsk.","łyżeczka":"tsk.","łyżeczki":"tsk.","łyżeczek":"tsk.","ząbek":"fed","ząbki":"fed","ząbków":"fed","puszka":"dåse","puszki":"dåser","puszek":"dåser","pęczek":"bundt","kromki":"skiver","kromek":"skiver","plastry":"skiver","plastrów":"skiver","liście":"blade","ziarna":"korn","ziaren":"korn","żółtko":"æggeblomme","żółtka":"æggeblommer","opcjonalnie":"valgfrit","szt.":"stk.","ok.":"ca."}}[lang];
  s=s.replace(/[^\s()]+/g,w=>(w in W)?W[w]:w).replace(/\s+/g," ").trim();
  if(lang==="en")s=s.replace(/(\d),(\d)/g,"$1.$2");
  return s;
}

/* ======================================================================
   STAN I NARZĘDZIA
   ====================================================================== */
const STAPLES=new Set(["sól","pieprz","olej","oliwa","masło","mąka","cukier","czosnek","cebula","bulion","bulion warzywny","woda"]);
const SPICES=new Set(["papryka słodka mielona","majeranek","liść laurowy","ziele angielskie","kminek","kmin rzymski","oregano","tymianek","cynamon","curry","kurkuma","chili","gałka muszkatołowa","proszek do pieczenia","cukier waniliowy","cukier puder"]);
const QUICK=["jajka","mleko","ser żółty","kurczak","mięso mielone","boczek","kiełbasa","dorsz","ziemniaki","ryż","makaron","pomidory","papryka","ogórek","marchew","pieczarki","śmietana","twaróg","jabłka"];
const EXAMPLE=["kurczak","ziemniaki","pieczarki","śmietana","jajka"];
const LANGS=["pl","en","da"];
const TR={en:window.PRZEPISY_EN||{},da:window.PRZEPISY_DA||{}};
const PAGE=12;
const $=id=>document.getElementById(id);
const RECIPES=window.PRZEPISY||[];

function norm(s){return String(s||"").toLowerCase().replace(/ł/g,"l").replace(/æ/g,"ae").replace(/ø/g,"o").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9%\s]/g," ").replace(/\s+/g," ").trim()}
const KEYS=new Map(), FORMS=[], seenForm=new Set();
SLOWNIK.split("\n").forEach(line=>{
  const[head,pl,en,da]=line.split("|");const[key,parent]=head.split(">");
  const names={pl:pl.split(","),en:(en||"").split(","),da:(da||"").split(",")};
  KEYS.set(key,{key,parent:parent||null,names});
  LANGS.forEach(l=>names[l].forEach(f=>{f=f.trim();const n=norm(f);if(n&&!seenForm.has(n)){seenForm.add(n);FORMS.push({n,key})}}));
});
function keyOf(text){
  const n=norm(text);if(!n)return null;
  const ex=FORMS.find(f=>f.n===n);if(ex)return ex.key;
  // luźne dopasowanie końcówek: „kurczakiem”, „pomidorami”, „tomatoes”
  let best=null,bestLen=0;
  for(const f of FORMS){
    if(f.n.split(" ").length!==n.split(" ").length)continue;
    let k=0;while(k<f.n.length&&k<n.length&&f.n[k]===n[k])k++;
    if(k>=4&&k>=Math.min(f.n.length,n.length)-3&&k>bestLen){best=f.key;bestLen=k}
  }
  return best;
}
const parentOf=k=>(KEYS.get(k)||{}).parent;
function covers(u,r){return u===r||parentOf(r)===u||parentOf(u)===r}
function nameIn(key,lang,fallback){const e=KEYS.get(key);return (e&&e.names[lang]&&e.names[lang][0])||fallback||key}

RECIPES.forEach(r=>{r._s=r.s.map(([name,amt])=>({name,amt,key:keyOf(name)||norm(name)}))});

let lang="pl", ings=[], isExample=false, shown=PAGE;
const T=()=>UI[lang];
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function read(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}}

function pickLang(){
  const saved=read("zlnt-lang");if(LANGS.includes(saved))return saved;
  const nav=(navigator.languages||[navigator.language||""]).map(x=>String(x).slice(0,2).toLowerCase());
  for(const n of nav){if(n==="pl")return"pl";if(n==="da"||n==="fo")return"da";if(n==="en")return"en"}
  return"pl";
}
function load(){const s=read("zlnt-ings");if(Array.isArray(s)){ings=s.filter(x=>typeof x==="string");return}ings=EXAMPLE.map(k=>nameIn(k,lang));isExample=true}
function save(){isExample=false;store("zlnt-ings",ings)}
const OPT_IDS=["typ","czas","dieta","sort","staples","spices"];
function loadOpts(){const o=read("zlnt-opts")||{};OPT_IDS.forEach(id=>{if(!(id in o))return;const e=$(id);if(e.type==="checkbox")e.checked=!!o[id];else e.value=o[id]})}
function saveOpts(){const o={};OPT_IDS.forEach(id=>{const e=$(id);o[id]=e.type==="checkbox"?e.checked:e.value});store("zlnt-opts",o)}

function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function plural(n,forms){if(lang!=="pl")return n===1?forms[0]:forms[1];if(n===1)return forms[0];const d=n%10,h=n%100;return(d>=2&&d<=4&&!(h>=12&&h<=14))?forms[1]:forms[2]}

/* ======================================================================
   JĘZYK
   ====================================================================== */
function fillSelect(id,map,order,def){const s=$(id),v=s.value;s.textContent="";order.forEach(k=>{const o=document.createElement("option");o.value=k;o.textContent=map[k];s.append(o)});s.value=(v&&order.includes(v))?v:(def||order[0])}
function applyStatic(){
  const t=T();
  document.documentElement.lang=lang;document.title=t.title;
  $("h1a").textContent=t.h1a;$("h1b").textContent=t.h1b;$("lede").textContent=t.lede;
  $("fridgeLabel").textContent=t.fridge;$("exNote").textContent=t.example;$("clearBtn").textContent=t.clear;
  $("ingInput").placeholder=t.placeholder;$("ingInput").setAttribute("aria-label",t.addAria);$("addBtn").textContent=t.add;
  $("unknownHint").textContent=t.unknownHint;$("quickLabel").textContent=t.quick;
  $("lblTyp").textContent=t.meal;$("lblCzas").textContent=t.time;$("lblDieta").textContent=t.diet;$("lblSort").textContent=t.sort;
  fillSelect("typ",t.typ,["any","obiad","zupa","sniadanie","salatka","deser"],"obiad");
  fillSelect("czas",t.czas,["0","20","30","45","60"]);
  fillSelect("dieta",t.dietaOpt,["none","wege","weganskie","bezmiesa"]);
  fillSelect("sort",t.sortOpt,["used","missing","time"]);
  $("lblStaples").textContent=t.staples;$("lblSpices").textContent=t.spices;
  $("res-h").textContent=t.results;$("moreBtn").textContent=t.more;$("sites-h").textContent=t.sitesH;$("footer").textContent=t.footer;
  document.querySelectorAll("#langs button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
  const dl=$("ingList");dl.textContent="";const seen=new Set();KEYS.forEach((v,k)=>{const n=nameIn(k,lang);if(!seen.has(n)){seen.add(n);const o=document.createElement("option");o.value=n;dl.append(o)}});
}
function setLang(l){
  if(!LANGS.includes(l))return;
  lang=l;store("zlnt-lang",l);
  // przetłumacz rozpoznane składniki w lodówce na nowy język
  const out=[],seen=new Set();
  ings.forEach(x=>{const k=keyOf(x);const v=k?nameIn(k,lang):x;const id=k||norm(x);if(!seen.has(id)){seen.add(id);out.push(v)}});
  ings=out;if(!isExample)store("zlnt-ings",ings);
  applyStatic();update();
}
document.querySelectorAll("#langs button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));

/* ======================================================================
   LODÓWKA
   ====================================================================== */
function userKeys(){return ings.map(l=>({label:l,key:keyOf(l)}))}
function renderChips(){
  const t=T();
  $("exNote").hidden=!isExample;
  const c=$("chips");c.textContent="";
  if(!ings.length)c.append(el("span","empty",t.emptyNone));
  let unknown=0;
  userKeys().forEach(({label,key},i)=>{
    const s=el("span","chip"+(key?"":" unknown"));s.append(label);if(!key){unknown++;s.title=t.unknownTitle}
    const b=el("button",null,"×");b.type="button";b.setAttribute("aria-label",t.remove+": "+label);
    b.onclick=()=>{ings.splice(i,1);save();update()};s.append(b);c.append(s);
  });
  $("unknownHint").hidden=!unknown;
}
function renderQuick(){
  const have=new Set(userKeys().map(u=>u.key));
  const q=$("quick");q.textContent="";
  QUICK.filter(k=>!have.has(k)).forEach(k=>{const n=nameIn(k,lang);const b=el("button",null,"+ "+n);b.type="button";b.onclick=()=>add(n);q.append(b)});
}
function add(raw){
  const have=new Set(userKeys().map(u=>u.key||norm(u.label)));
  raw.split(/[,;\n]/).map(s=>s.trim().toLowerCase()).filter(Boolean).forEach(l=>{const k=keyOf(l)||norm(l);if(!have.has(k)){ings.push(l);have.add(k)}});
  save();shown=PAGE;update();
}
$("addForm").addEventListener("submit",e=>{e.preventDefault();const v=$("ingInput").value;if(v.trim())add(v);$("ingInput").value="";$("ingInput").focus()});
$("clearBtn").onclick=()=>{ings=[];save();update()};
OPT_IDS.forEach(id=>$(id).addEventListener("change",()=>{saveOpts();shown=PAGE;renderResults()}));
$("moreBtn").onclick=()=>{shown+=PAGE;renderResults()};

/* ======================================================================
   DOPASOWANIE I WYNIKI
   ====================================================================== */
function score(r,mine,staples,spices){
  const used=new Set();let need=0;
  const rows=r._s.map(it=>{
    const m=mine.find(u=>u.key&&covers(u.key,it.key));
    if(m){used.add(m.label);return{...it,st:"h"}}
    if((staples&&STAPLES.has(it.key))||(spices&&SPICES.has(it.key)))return{...it,st:"s"};
    need++;return{...it,st:"m"};
  });
  return{rows,used:[...used],need};
}
function dietOK(r,d){if(d==="none")return true;if(d==="weganskie")return r.dieta==="weganskie";if(d==="wege")return r.dieta==="wege"||r.dieta==="weganskie";return r.dieta!=="mieso"}
function textOf(r){if(lang==="pl")return{n:r.n,o:r.o,k:r.k,tr:true};const x=TR[lang][r.n];return x?{n:x.n||r.n,o:x.o||r.o,k:(x.k&&x.k.length)?x.k:r.k,tr:true}:{n:r.n,o:r.o,k:r.k,tr:false}}

function renderResults(){
  const t=T(),L=$("list");L.textContent="";
  const mine=userKeys().filter(u=>u.key);
  const typ=$("typ").value,czas=+$("czas").value,dieta=$("dieta").value,sort=$("sort").value,staples=$("staples").checked,spices=$("spices").checked;
  let list=RECIPES.filter(r=>(typ==="any"||r.typ===typ)&&(!czas||r.czas<=czas)&&dietOK(r,dieta))
    .map(r=>({r,s:score(r,mine,staples,spices)})).filter(x=>x.s.used.length);
  const cU=(a,b)=>b.s.used.length-a.s.used.length,cN=(a,b)=>a.s.need-b.s.need,cT=(a,b)=>a.r.czas-b.r.czas;
  list.sort(sort==="missing"?(a,b)=>cN(a,b)||cU(a,b)||cT(a,b):sort==="time"?(a,b)=>cT(a,b)||cN(a,b):(a,b)=>cU(a,b)||cN(a,b)||cT(a,b));
  $("count").textContent=list.length?list.length+" "+plural(list.length,t.recipes):"";
  $("moreBtn").hidden=list.length<=shown;
  if(!list.length){L.append(el("div","note",!ings.length?t.emptyNone:!mine.length?t.emptyUnknown:t.emptyFilters));return}
  list.slice(0,shown).forEach(({r,s},i)=>L.append(card(r,s,i===0)));
}
function card(r,s,open){
  const t=T(),x=textOf(r);
  const d=el("details","recipe");d.open=open;
  const sm=el("summary");
  sm.append(el("h3",null,x.n));
  const meta=el("div","meta");
  [r.czas+" min",r.porcje+" "+plural(r.porcje,t.portions),t.trud[r.trud]||r.trud,t.typLabel[r.typ],t.dieta[r.dieta]].forEach(v=>meta.append(el("span",null,v)));
  sm.append(meta);
  if(x.o)sm.append(el("p","desc",x.o));
  const sc=el("div","score");
  sc.append(el("span","pill have","✓ "+s.used.join(", ")));
  sc.append(s.need?el("span","pill miss",t.toBuy+": "+s.need):el("span","pill have",t.nothingToBuy));
  sm.append(sc,el("div","more",t.show));
  d.append(sm);
  const b=el("div","body");
  const a=el("div");a.append(el("div","label",t.ingredients));
  const ul=el("ul","ings");
  s.rows.forEach(it=>{const li=el("li",it.st);li.append(el("span","mk",it.st==="h"?"✓":it.st==="s"?"·":"+"));
    const nm=lang==="pl"?it.name:nameIn(it.key,lang,it.name);
    const sp=el("span");sp.append(nm);if(it.amt)sp.append(" ",el("span","amt",amountIn(it.amt,lang)));li.append(sp);ul.append(li)});
  a.append(ul,el("div","amt legend",t.legend));
  const m=el("div");m.append(el("div","label",t.method));
  const ol=el("ol","steps");x.k.forEach(v=>ol.append(el("li",null,v)));m.append(ol);
  const links=el("div","links");
  if(!x.tr&&t.untranslated)links.append(el("span","untr",t.untranslated));
  const g=el("a",null,t.other);g.href="https://www.google.com/search?q="+encodeURIComponent(x.n+" "+t.recipeWord);g.target="_blank";g.rel="noopener";links.append(g);
  b.append(a,m,links);d.append(b);
  return d;
}
function renderSites(){
  const t=T(),box=$("siteLinks");box.textContent="";
  const words=ings.slice(0,4);
  $("sitesText").textContent=words.length?t.sitesWith+words.join(", ")+t.sitesTail:t.sitesEmpty;
  if(!words.length)return;
  t.sites.forEach(([name,host])=>{const a=el("a",null,name+" ↗");a.href="https://www.google.com/search?q="+encodeURIComponent("site:"+host+" "+t.recipeWord+" "+words.join(" "));a.target="_blank";a.rel="noopener";box.append(a)});
}
function update(){renderChips();renderQuick();renderResults();renderSites()}

lang=pickLang();load();applyStatic();loadOpts();update();
</script>
